        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif; background-color: var(--bg-container); color: var(--text-primary); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .calculator-container { width: 100%; max-width: 450px; height: 100vh; display: flex; flex-direction: column; background-color: var(--bg-main); box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); position: relative; }
        .top-bar { display: flex; justify-content: space-around; align-items: center; padding: 15px 10px; flex-shrink: 0; border-bottom: 1px solid var(--top-bar-border); }
        .top-bar-icon { font-size: 20px; color: var(--top-bar-icon); cursor: pointer; padding: 5px 8px; border-radius: 8px; transition: background-color 0.2s, color 0.2s; }
        .top-bar-icon:hover { background-color: var(--btn-active-bg); }
        .top-bar-icon.active { color: var(--top-bar-icon-active-text); background-color: var(--top-bar-icon-active-bg); }
        .top-bar-icon.clear-history-icon { color: var(--btn-clear-text); }
        .main-calculator-interface, .panel-container { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
        .panel-container { padding: 8px; background-color: var(--bg-main); }
        .display-container { flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; padding-bottom: 10px; overflow: hidden; word-break: break-all; min-height: 80px; }
        .previous-operand { font-size: 1.1em; color: var(--text-secondary); text-align: right; min-height: 1.4em; line-height: 1.4em; }
        .current-operand { font-size: 2.6em; font-weight: 300; color: var(--text-primary); text-align: right; min-height: 1.4em; line-height: 1.4em; }
        .buttons-container { padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); flex-shrink: 0; position: relative; }
        .buttons-grid { display: grid; gap: 6px; }
        .basic-grid { grid-template-columns: repeat(4, 1fr); }
        .scientific-grid { grid-template-columns: repeat(7, 1fr); }
        .btn { font-size: 1.4em; padding: 0; border: none; border-radius: 50%; background-color: var(--btn-bg); color: var(--btn-text); cursor: pointer; transition: background-color 0.2s, color 0.2s, opacity 0.2s; display: flex; justify-content: center; align-items: center; aspect-ratio: 1 / 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .scientific-grid .btn { font-size: 1.0em; }
        .scientific-grid .btn.operator, .scientific-grid .btn.equals, .scientific-grid .btn.function[data-action="parentheses-sci"], .scientific-grid .btn.operator[data-operator="%"] { font-size: 1.2em; }
        .basic-grid .btn.function[data-action="parentheses-basic"] { font-size: 1.5em; }
        .btn:active { background-color: var(--btn-active-bg); }
        .btn.operator, .btn.function[data-action="parentheses-basic"], .btn.function[data-action="parentheses-sci"], .btn.operator[data-operator="%"] { color: var(--btn-operator-text); }
        .btn.operator.active-op { background-color: var(--btn-operator-text); color: var(--btn-bg); }
        .btn.function.scientific { color: var(--btn-operator-text); }
        .btn.function.scientific.shift-btn.active { background-color: var(--btn-active-bg); color: var(--text-primary); }
        .btn.function.scientific.rad-deg.active { background-color: var(--btn-operator-text); color: var(--btn-bg); }
        .btn.function.clear { color: var(--btn-clear-text); }
        .btn.equals { background-color: var(--btn-equals-bg); color: var(--btn-equals-text); }
        .btn.equals:active { background-color: var(--btn-operator-text); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: var(--text-primary); padding: 0 3px; }
        .panel-header h2 { margin: 0; font-size: 1.2em; font-weight: 500; }
        .panel-header .top-bar-icon { font-size: 1.3em; padding: 3px 6px; }
        #history-list-container { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; padding-right: 3px; }
        .history-item { padding: 8px 3px; margin-bottom: 4px; border-bottom: 1px solid var(--history-item-border); cursor: pointer; display: flex; flex-direction: column; align-items: flex-end; color: var(--text-secondary); font-size: 1.0em; }
        .history-item:hover { background-color: var(--history-item-hover-bg); }
        .history-item .expression { opacity: 0.7; font-size: 0.8em; margin-bottom: 2px; word-break: break-all; width: 100%; text-align: right; }
        .history-item .result { color: var(--text-primary); font-weight: 500; font-size: 1.2em; }
        .btn.panel-action-btn { width: auto; padding: 10px 18px; border-radius: 7px; background-color: var(--btn-equals-bg); color: var(--btn-equals-text); font-size: 1.0em; align-self: center; margin-top: auto; flex-shrink: 0; }
        .btn.panel-action-btn:active { background-color: var(--btn-operator-text); }
        #shift-tooltip { display: none; position: absolute; top: -20px; left: 10px; background-color: var(--tooltip-bg); color: var(--tooltip-text); padding: 4px 8px; border-radius: 4px; font-size: 0.8em; z-index: 10; pointer-events: none; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
        .converter-tabs { display: flex; margin-bottom: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .converter-tabs::-webkit-scrollbar { display: none; }
        .converter-tab { padding: 5px 10px; margin-right: 6px; border: 1px solid var(--select-border); border-radius: 16px; cursor: pointer; color: var(--text-secondary); white-space: nowrap; font-size: 0.8em; }
        .converter-tab.active { background-color: var(--btn-operator-text); color: var(--bg-main); border-color: var(--btn-operator-text); }
        .converter-section { display: flex; flex-direction: column; gap: 0; flex-grow: 1; margin-bottom: 8px; }
        .unit-conversion-row { padding: 10px 5px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .unit-conversion-row.input-row { border-bottom: 1px solid var(--history-item-border); }
        .unit-name-selector { color: var(--text-secondary); font-size: 1.0em; cursor: pointer; display: flex; align-items: center; padding: 5px 0; z-index: 2; position: relative; }
        .unit-name-selector .arrow { display: inline-block; margin-left: 4px; font-size: 0.7em; color: var(--text-secondary); }
        .unit-value-display { font-size: 1.4em; color: var(--text-primary); display: flex; align-items: baseline; }
        .unit-value-display.output-value { font-size: 2.0em; color: var(--btn-operator-text); justify-content: center; padding: 15px 0; width: 100%; }
        .unit-value-display .unit-symbol-inline { font-size: 0.7em; color: var(--text-secondary); margin-left: 5px; }
        .unit-select { position: absolute; top: 0; left: 0; width: 50%; height: 100%; opacity: 0; pointer-events: auto; cursor: pointer; z-index: 1; -webkit-appearance: none; -moz-appearance: none; appearance: none; border: none; background: transparent; }
        .converter-section > div[style*="text-align: center"] { margin: 3px 0 !important; font-size: 1.2em !important; color: var(--text-secondary) !important;}
        .converter-keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-bottom: max(8px, env(safe-area-inset-bottom)); flex-shrink: 0; }
        .converter-keypad .btn { font-size: 1.4em; background-color: var(--btn-bg); color: var(--btn-text); }
        .converter-keypad .btn.action { color: var(--btn-operator-text); }
        .converter-keypad .btn.action.clear { color: var(--btn-clear-text); }
        .converter-keypad .btn.nav-arrow { font-size: 1.6em; }
        #theme-menu { display: none; position: absolute; top: 50px; left: 10px; background-color: var(--btn-bg); border: 1px solid var(--top-bar-border); border-radius: 8px; padding: 5px; z-index: 20; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        #theme-menu button { display: block; width: 100%; padding: 8px 12px; background: none; border: none; color: var(--btn-text); text-align: left; cursor: pointer; font-size: 0.9em; border-radius: 4px; }
        #theme-menu button:hover { background-color: var(--btn-active-bg); }
        #theme-menu button.active-theme { background-color: var(--btn-operator-text); color: var(--bg-main); font-weight: bold; }
        .btn, .top-bar-icon, .converter-tab, .unit-name-selector, .history-item { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

<body>
    <div class="calculator-container">
        <div class="top-bar">
            <span class="top-bar-icon" id="theme-toggle-btn" title="Temayı Değiştir">🎨</span>
            <span class="top-bar-icon" id="history-toggle-btn" title="Geçmiş">🕒</span>
            <span class="top-bar-icon" id="converter-toggle-btn" title="Birim Dönüştürücü">📏</span>
            <span class="top-bar-icon" id="scientific-toggle-btn" title="Bilimsel Mod"><sup>π</sup>⁄<sub>√</sub></span>
            <span class="top-bar-icon clear-history-icon" id="backspace-btn" title="Girişi Sil (Backspace)">⌫</span>

            _countChar(str, char) { const regex = new RegExp(`\\${char}`, 'g'); return (str.match(regex) || []).length; }

''; this.justComputed = true; if (addToHistoryFlag && this.expressionForHistory && this.currentOperand !== undefined) { this.addToHistory(this.currentOperand); } this.updateDisplay(); }
            addToHistory(result, expressionOverride = null) { const expression = expressionOverride || this.expressionForHistory || this.currentOperand; const resultStr = result !== undefined ? result.toString() : 'Hata'; const exprStr = expression !== undefined ? expression.toString() : 'Hata'; if (!exprStr || resultStr === undefined || exprStr.trim() === resultStr.trim() || exprStr.trim() === '' || resultStr.trim() === '' || exprStr.trim() === '0' && resultStr.trim() === '0' ) { this.expressionForHistory = ''; return; } if (this.history.length >= 50) { this.history.shift(); } this.history.push({ expression: exprStr, result: resultStr }); this.expressionForHistory = ''; }

            handleUnaryOperation(action) { let originalCurrentOperand = this.currentOperand; let valueStr = this.currentOperand; let value = parseFloat(valueStr.replace(',', '.')); let result; let funcPrefix = ""; const prefixFunctions = ['sin', 'cos', 'tan', 'ln', 'log', 'sqrt', 'cbrt', 'exp', 'asin', 'acos', 'atan', 'sinh', 'cosh', 'tanh', 'asinh', 'acosh', 'atanh']; if (prefixFunctions.includes(action)) { funcPrefix = action; this.expressionForHistory = `${funcPrefix}(${originalCurrentOperand})`; if (this.justComputed || valueStr === '0') { this.currentOperand = funcPrefix + '('; } else { this.currentOperand += funcPrefix + '('; } this.justComputed = false; this.updateDisplay(); return; } if (action === 'pi') { result = Math.PI; this.expressionForHistory = 'π'; } else if (action === 'e') { result = Math.E; this.expressionForHistory = 'e'; } else if (!isNaN(value)) { if (action === 'negate') this.expressionForHistory = `negate(${originalCurrentOperand})`; else if (action === 'reciprocal') this.expressionForHistory = `1/(${originalCurrentOperand})`; else if (action === 'square') this.expressionForHistory = `sqr(${originalCurrentOperand})`; else if (action === 'abs') this.expressionForHistory = `abs(${originalCurrentOperand})`; else if (action === 'pow2x') this.expressionForHistory = `2^(${originalCurrentOperand})`; else if (action === 'powx3') this.expressionForHistory = `(${originalCurrentOperand})^3`; else if (action === 'fact') this.expressionForHistory = `(${originalCurrentOperand})!`; else { this.expressionForHistory = `${action}(${originalCurrentOperand})`;} switch(action) { case 'negate': result = -value; break; case 'reciprocal': result = (value === 0) ? NaN : 1 / value; break; case 'square': result = Math.pow(value, 2); break; case 'abs': result = Math.abs(value); break; case 'pow2x': result = Math.pow(2, value); break; case 'powx3': result = Math.pow(value, 3); break; case 'fact': result = this._factorial(value); break; case 'asin': result = this.isRadian                 const mainInterfaceVisible = !calculator.mainInterfaceDiv.classList.contains('hidden');
                const converterPanelVisible = !calculator.converterPanelContainer.classList.contains('hidden');
                const currentPanelIsScientific = calculator.isScientificMode && mainInterfaceVisible;

                if (converterPanelVisible && unitConverterInstance) {
                    if (key >= '0' && key <= '9') { const btn = unitConverterInstance.converterKeypad.querySelector(`[data-converter-number="${key}"]`); if(btn) btn.click(); }
                    else if (key === '.' || key === ',') { const btn = unitConverterInstance.converterKeypad.querySelector('[data-converter-action="decimal"]'); if(btn) btn.click(); }
                    else if (key === 'Backspace') { const btn = unitConverterInstance.converterKeypad.querySelector('[data-converter-action="backspace"]'); if(btn) btn.click(); }
                    else if (key.toLowerCase() === 'c' || key === 'Escape') { const btn = unitConverterInstance.converterKeypad.querySelector('[data-converter-action="clear"]'); if(btn) btn.click(); }
                    return;
                }
                if (!mainInterfaceVisible) return;
                if (key >= '0' && key <= '9') calculator.appendNumber(key);
                else if (key === '.' || key === ',') calculator.appendNumber(',');
                else if (['+', '-', '*', '/', '%', '^'].includes(key)) { let op = key; if (key === '*') op = '×'; if (key === '/') op = '÷'; if (!currentPanelIsScientific && (op === '^')) return; if (!currentPanelIsScientific && op === '+' && !document.querySelector('#basic-buttons-panel [data-operator="+"]')) return; calculator.chooseOperation(op); }
                else if (key === 'Enter' || key === '=') { event.preventDefault(); calculator.compute(); }
                else if (key === 'Backspace') calculator.deleteLast();
                else if (key.toLowerCase() === 'c' || key === 'Escape') calculator.clear();
                else if (key === '(' || key === ')') { if (currentPanelIsScientific) calculator.handleParenthesesScientific(); else calculator.handleParenthesesBasic(); }
            });
        }
    
    </script>
</body>
</html>
